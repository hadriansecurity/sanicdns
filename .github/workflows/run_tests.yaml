name: Build & Run Tests

on: [pull_request]

jobs:
  build_and_test:
    strategy:
      matrix:
        compiler: [gcc, clang]
        nic_type: [AF_XDP, I40E]
        arch: [x86_64, aarch64]
    name: Build bruteforcer (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2
        with:
          path: src/
          submodules: recursive

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('/etc/apt/sources.list') }}

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential \
                            git \
                            cmake \
                            ninja-build \
                            python3 \
                            libelf-dev \
                            dpdk \
                            dpdk-dev \
                            libncurses5-dev \
                            liburing-dev \
                            software-properties-common \
                            linux-headers-generic \
                            libbpf-dev \
                            libc6-dev \
                            libxdp-dev \
                            clang-17

      - name: Install x86_64 specific packages
        if: matrix.arch == 'x86_64'
        run: sudo apt-get install -y libc6-dev-i386

      # - name: Setup tmate session
      #   if: matrix.arch == 'aarch64'
      #   uses: mxschmitt/action-tmate@v3

      - name: Symlink asm folder
        if: matrix.arch == 'x86_64'
        run: sudo ln -s /usr/include/asm-generic/ /usr/include/asm

      - name: Symlink asm folder
        if: matrix.arch == 'aarch64'
        run: sudo ln -s /usr/include/aarch64-linux-gnu/asm /usr/include/asm

      - name: Make build dir
        run: mkdir src/build

      - name: Generate build files
        run: cmake -S src/ -B src/build -DCMAKE_GENERATOR=Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE=ci/${{matrix.compiler}}-toolchain.cmake -DNIC_TYPE=${{matrix.nic_type}} -DBUILD_TESTS=ON

      - name: Build bruteforcer
        run: ninja -C src/build

      - name: Run tests
        run: ctest run --test-dir src/build --output-on-failure
